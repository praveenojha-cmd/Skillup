<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=admin-portal/index.html">
    <title>Redirecting to SkillUp Admin Portal...</title>
    <script>
        // Preserve any URL hash (e.g. a Supabase Auth recovery/signup token
        // delivered as #access_token=...&type=recovery&...) when redirecting,
        // so it isn't silently discarded before the app can process it.
        window.location.href = "admin-portal/index.html" + window.location.hash;
    </script>
</head>

        <p style="color: #94A3B8; font-size: 14px;">Redirecting to Admin Portal... <a href="admin-portal/index.html" style="color: #60A5FA;">Click here if not redirected</a></p>
    </div>
</body>
</html>
